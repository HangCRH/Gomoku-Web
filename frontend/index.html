<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋</title>
    <script src="main.js"></script>
    <script src="offline.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <b id="title" style="font-size:25px;" onclick="outinfor()">五子棋</b>
    <hr>
    <div id="setChessboard">
        输入棋盘宽度：<input type="text" id="sizex"><br>
        输入棋盘高度：<input type="text" id="sizey"><br>
    </div>
    <input type="button" id="startbtn" value="开始" onclick="startgame()">&nbsp;
    <input type="button" value="对局历史" onclick="showHistory()">
    <table id="chessboard"></table>
    <div>
        <b id="outplayerarea"></b>
    </div>
    <div>
        <b id="outarea2"></b>
    </div>
</body>

</html>
