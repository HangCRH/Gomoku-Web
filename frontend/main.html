<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>五子棋v1.3.2</title>
    <script src="JScode.js"></script>
    <style>
        #qipan {
            border-collapse: collapse;
        }
        #qipan td {
            border: 1px solid black;
        }
        #qipan td input{
            margin: 2px;
        }
        #qipan td img{
            margin: auto;
        }
        #outarea2{
            color: #ff4c13;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <b style="font-size:25px;">五子棋</b><hr>
    输入棋盘宽度：<input type="text" id="sizex"><br>
    输入棋盘高度：<input type="text" id="sizey"><br>
    <input type="button" id="startbtn" value="开始" onclick="load()"><hr>
    <input type="button" id="stopbtn" value="终止本轮游戏" onclick="stopthisgame(true)" disabled><br><br>
    <table id="qipan"></table>
    <div>
        <b id="outplayerarea"></b>
    </div>
    <div>
        <b id="outarea2"></b>
    </div>
</body>
</html>
